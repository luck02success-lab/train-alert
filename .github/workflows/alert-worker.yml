name: Train Alert Worker

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: train-alert-worker
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run-alert-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Run alert worker
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body \
            --show-error \
            --silent \
            -X POST \
            https://train-alert-api.vercel.app/api/alerts/run \
            -H "Authorization: Bearer ${CRON_SECRET}"